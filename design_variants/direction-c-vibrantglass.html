<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&family=Rozha+One&display=swap" rel="stylesheet">
  <style> 
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0F172A; color: white; } 
    .devanagari { font-family: 'Rozha One', serif; } 
    .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .gradient-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; overflow: hidden; background: #0F172A; }
    .blob1 { position: absolute; top: -10%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(236,72,153,0.3) 0%, rgba(15,23,42,0) 70%); border-radius: 50%; filter: blur(60px); }
    .blob2 { position: absolute; bottom: -10%; right: -10%; width: 60vw; height: 60vw; background: radial-gradient(circle, rgba(56,189,248,0.2) 0%, rgba(15,23,42,0) 70%); border-radius: 50%; filter: blur(80px); }
  </style>
</head>
<body class="p-4 md:p-12 min-h-screen relative">
  
  <div class="gradient-bg">
    <div class="blob1"></div>
    <div class="blob2"></div>
  </div>

  <div class="max-w-6xl mx-auto space-y-16 relative z-10">
    
    <!-- Hero Concept -->
    <div class="glass rounded-[2rem] p-12 md:p-24 text-center">
      <div class="inline-flex items-center gap-2 bg-white/10 px-4 py-2 rounded-full text-sm font-medium text-sky-300 mb-8 border border-white/10">
        <span class="relative flex h-3 w-3"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-sky-400 opacity-75"></span><span class="relative inline-flex rounded-full h-3 w-3 bg-sky-500"></span></span>
        Active Mentors Online
      </div>
      <h1 class="text-5xl md:text-7xl font-bold leading-tight mb-6">
        Elevate Your Potential with <br><span class="text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-sky-400 devanagari font-normal text-6xl md:text-8xl leading-relaxed">विचार</span>
      </h1>
      <p class="text-xl text-slate-300 mb-10 max-w-2xl mx-auto">Premium 1:1 mentorship from industry leaders, wrapped in a frictionless experience.</p>
      <button class="bg-white text-slate-900 px-8 py-4 rounded-xl text-lg font-bold hover:bg-slate-200 transition-colors shadow-[0_0_40px_rgba(255,255,255,0.3)]">Get Started Today</button>
    </div>

    <!-- Mentor Cards Concept -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      
      <!-- Card 1 (Sushma) -->
      <div class="glass p-8 rounded-[1.5rem] hover:-translate-y-1 transition-all duration-300 cursor-pointer group flex items-start gap-6">
        <img src="https://customer-assets.emergentagent.com/job_mentor-connect-230/artifacts/qi1pahac_Viktor%20-%20Data_AI.jpg" class="w-24 h-24 rounded-2xl object-cover border border-white/20 group-hover:border-pink-400 transition-colors">
        <div class="flex-1">
          <h3 class="font-bold text-2xl text-white mb-1">Sushma Shukla</h3>
          <p class="text-sky-300 font-medium mb-3">CEO & Leadership Coach</p>
          <div class="flex gap-2 mb-6">
            <span class="bg-white/5 border border-white/10 text-slate-300 px-3 py-1 rounded-md text-xs font-medium">Leadership</span>
            <span class="bg-white/5 border border-white/10 text-slate-300 px-3 py-1 rounded-md text-xs font-medium">Strategy</span>
          </div>
          <button class="bg-white/10 text-white w-full py-3 rounded-lg font-medium hover:bg-white hover:text-slate-900 transition-colors border border-white/10">View Profile</button>
        </div>
      </div>
      
    </div>
  </div>
</body>
</html>
